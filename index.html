<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>裝置藝術互動展示</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }

    /* 播放器容器 */
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    video.main-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease; /* 切換時的淡入淡出效果 */
    }

    video.active {
      opacity: 1;
    }

    /* 隱藏相機與偵測用的 Canvas */
    #webcam, #motion-canvas {
      display: none;
    }

    /* 啟動按鈕遮罩（瀏覽器限制必須有使用者互動才能開啟相機與音訊） */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
    }

    #start-overlay button {
      padding: 15px 30px;
      font-size: 1.2rem;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- 啟動遮罩 -->
  <div id="start-overlay">
    <h1>裝置藝術互動系統</h1>
    <p>請點擊下方按鈕以授權相機並啟動展示</p>
    <button id="start-btn">開始展示</button>
  </div>

  <!-- 影片播放器 -->
  <div class="video-container">
    <!-- Video A：無人時循環播放 -->
    <video id="videoA" class="main-video active" src="videoA.mp4" loop muted playsinline></video>
    <!-- Video B：有人走動時切換播放 -->
    <video id="videoB" class="main-video" src="videoB.mp4" loop muted playsinline></video>
  </div>

  <!-- 輔助偵測元素 -->
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="motion-canvas" width="64" height="48"></canvas>

  <script>
    const videoA = document.getElementById('videoA');
    const videoB = document.getElementById('videoB');
    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('motion-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');

    // 參數設定（可依展場光線與距離微調）
    const MOTION_THRESHOLD = 25;   // 單一像素變化的靈敏度（0-255，越低越靈敏）
    const PIXEL_SCORE_LIMIT = 80;  // 判定為「有動作」的累積變動像素數量數量門檻
    const NO_MOTION_DELAY = 2000;  // 停止動作後，延遲多久（毫秒）切回 Video A

    let prevFrame = null;
    let lastMotionTime = 0;
    let isPersonDetected = false;

    // 初始化與請求相機權限
    async function init() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: 320, height: 240, frameRate: 15 } 
        });
        webcam.srcObject = stream;
        
        // 播放影片 A
        videoA.play();
        videoB.play(); // 預先播放 B（保持準備狀態），但透過 CSS opacity 隱藏

        startOverlay.style.display = 'none';
        
        // 開始動態偵測迴圈
        requestAnimationFrame(detectMotion);
      } catch (err) {
        alert('無法存取相機，請確認已授予權限：' + err.message);
      }
    }

    // 動態偵測演算法（幀差法）
    function detectMotion() {
      if (webcam.readyState === webcam.HAVE_ENOUGH_DATA) {
        // 將相機當前畫面繪製到低解析度 Canvas 上（降低計算量）
        ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
        const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        if (prevFrame) {
          let changedPixels = 0;
          const dataLength = currentFrame.data.length;

          // 逐像素比對 RGB 數值差異
          for (let i = 0; i < dataLength; i += 4) {
            const rDiff = Math.abs(currentFrame.data[i] - prevFrame.data[i]);
            const gDiff = Math.abs(currentFrame.data[i + 1] - prevFrame.data[i + 1]);
            const bDiff = Math.abs(currentFrame.data[i + 2] - prevFrame.data[i + 2]);

            // 若紅綠藍平均變動超過門檻，視為該像素有動態
            if ((rDiff + gDiff + bDiff) / 3 > MOTION_THRESHOLD) {
              changedPixels++;
            }
          }

          const now = Date.now();

          // 判定是否有走動
          if (changedPixels > PIXEL_SCORE_LIMIT) {
            lastMotionTime = now;
            if (!isPersonDetected) {
              switchToVideo('B');
            }
          } else {
            // 長時間無動態，切回 Video A
            if (isPersonDetected && (now - lastMotionTime > NO_MOTION_DELAY)) {
              switchToVideo('A');
            }
          }
        }

        prevFrame = currentFrame;
      }

      requestAnimationFrame(detectMotion);
    }

    // 影片切換邏輯
    function switchToVideo(target) {
      if (target === 'B') {
        isPersonDetected = true;
        videoB.currentTime = 0; // 若希望每次有人來都從頭播放 B，保留此行；若希望接續播放則刪除
        videoB.classList.add('active');
        videoA.classList.remove('active');
      } else {
        isPersonDetected = false;
        videoA.classList.add('active');
        videoB.classList.remove('active');
      }
    }

    startBtn.addEventListener('click', init);
  </script>
</body>
</html>
